<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Focal length and sensor diagonal</title>
  <desc id="chart-description">A photographic reference chart from 0 to 200 millimetres actual focal length, with sensor formats positioned by diagonal relative to full frame. Diagonal lines indicate 35, 50, and 70 millimetre full-frame-equivalent focal lengths. Phone sensor types are illustrative examples.</desc>
  <metadata>
    Sensor diagonals: medium format 44 by 33 mm, full frame 36 by 24 mm,
    representative APS-C 23.5 by 15.6 mm, Micro Four Thirds 17.3 by 13 mm,
    representative phone 1/1.3-type 12.6 mm, and 1/2.3-type 7.7 mm.
    Crop factor = 43.3 mm divided by sensor diagonal.
    References: https://en.wikipedia.org/wiki/Image_sensor_format
    https://en.wikipedia.org/wiki/Angle_of_view_(photography)
  </metadata>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #1c2933; }
      .muted { fill: #637580; }
      .grid { stroke: #d9e2e5; stroke-width: 1; }
      .axis { stroke: #637580; stroke-width: 1.5; }
      .eq35, .eq70 { stroke: #7d8f9b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .eq50 { stroke: #e97132; stroke-width: 3; }
      .format { font-size: 13px; }
    </style>
    <pattern id="five-mm-shading" x="250" y="40" width="49" height="270" patternUnits="userSpaceOnUse">
      <rect width="24.5" height="270" fill="#f8fafb"/>
    </pattern>
  </defs>
  <rect width="1280" height="410" fill="#ffffff"/>
  <rect x="250" y="40" width="980" height="270" fill="url(#five-mm-shading)"/>
  <polygon points="250,310 250,40 481.3,40" fill="#edf3f7" fill-opacity="0.72"/>
  <polygon points="250,310 481.3,40 713.3,40" fill="#f3f5f6" fill-opacity="0.72"/>
  <polygon points="713.3,40 1230,40 1230,310 250,310" fill="#f7f3ef" fill-opacity="0.72"/>

  <g>
    <line x1="250" y1="310" x2="1230" y2="310" class="grid"/>
    <line x1="250" y1="260" x2="1230" y2="260" class="grid"/>
    <line x1="250" y1="210" x2="1230" y2="210" class="grid"/>
    <line x1="250" y1="160" x2="1230" y2="160" class="grid"/>
    <line x1="250" y1="110" x2="1230" y2="110" stroke="#1a365d" stroke-width="2.2"/>
    <line x1="250" y1="60" x2="1230" y2="60" class="grid"/>

    <line x1="250" y1="40" x2="250" y2="310" class="axis"/>
    <line x1="372.5" y1="40" x2="372.5" y2="310" class="grid"/>
    <line x1="495" y1="40" x2="495" y2="310" class="grid"/>
    <line x1="617.5" y1="40" x2="617.5" y2="310" class="grid"/>
    <line x1="740" y1="40" x2="740" y2="310" class="grid"/>
    <line x1="862.5" y1="40" x2="862.5" y2="310" class="grid"/>
    <line x1="985" y1="40" x2="985" y2="310" class="grid"/>
    <line x1="1107.5" y1="40" x2="1107.5" y2="310" class="grid"/>
    <line x1="1230" y1="40" x2="1230" y2="310" class="axis"/>

    <line x1="250" y1="310" x2="481.3" y2="40" class="eq35"/>
    <line x1="250" y1="310" x2="581.8" y2="40" class="eq50"/>
    <line x1="250" y1="310" x2="713.3" y2="40" class="eq70"/>

    <text x="390" y="142" font-size="12" class="muted" transform="rotate(-49 390 142)">35 mm eq</text>
    <text x="473" y="142" font-size="13" font-weight="700" fill="#b84e1d" transform="rotate(-49 473 142)">50 mm eq</text>
    <text x="575" y="142" font-size="12" class="muted" transform="rotate(-49 575 142)">70 mm eq</text>

    <text x="372.5" y="332" text-anchor="middle" font-size="13" class="muted">25</text>
    <text x="495" y="332" text-anchor="middle" font-size="13" class="muted">50</text>
    <text x="617.5" y="332" text-anchor="middle" font-size="13" class="muted">75</text>
    <text x="740" y="332" text-anchor="middle" font-size="13" class="muted">100</text>
    <text x="862.5" y="332" text-anchor="middle" font-size="13" class="muted">125</text>
    <text x="985" y="332" text-anchor="middle" font-size="13" class="muted">150</text>
    <text x="1107.5" y="332" text-anchor="middle" font-size="13" class="muted">175</text>
    <text x="1230" y="332" text-anchor="middle" font-size="13" class="muted">200</text>

    <text x="14" y="56" class="format" font-weight="700" fill="#1a365d">MF 44×33 · 0.79×</text>
    <text x="14" y="114" class="format" font-weight="700" fill="#1a365d">FF 36×24 · 1.00×</text>
    <text x="14" y="184" class="format muted">APS-C · 1.54×</text>
    <text x="14" y="214" class="format muted">MFT · 2.00×</text>
    <text x="14" y="256" class="format muted">1/1.3-type · 3.44×</text>
    <text x="14" y="278" class="format muted">1/2.3-type · 5.62×</text>
  </g>
</svg>

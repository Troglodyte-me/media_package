name: Compile Typst to PDF

on:
  push:
    # Only run when files ending in .typ are pushed/updated
    paths:
      - '**.typ'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        # Upgraded to v5 to native Node.js 24 support, which removes the deprecation warning
        uses: typst-community/setup-typst@v5

      - name: Compile Typst files
        run: |
          # 1. Finds all .typ files in the repository.
          # 2. Excludes paths/filenames containing "template" or "design".
          # 3. Uses -print0 and read -d to safely handle file names containing spaces.
          # thanks @ Mammouth.AI / Gemini 3.5 Flash for support
          find . -name "*.typ" -not -path "*template*" -not -path "*design*" -print0 | while IFS= read -r -d '' file; do
            # Replace the .typ extension with .pdf
            pdf_file="${file%.typ}.pdf"
            echo "Compiling: $file -> $pdf_file"
            
            typst compile "$file" "$pdf_file"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          # This glob pattern gathers all compiled PDF files across your repo
          path: "**/*.pdf"

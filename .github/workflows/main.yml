name: Compile Typst to PDF

on:
  push:
    # Only run when files ending in .typ are pushed/updated
    paths:
      - '**.typ'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      # Replace "document.typ" and "document.pdf" with your file names
      - name: Compile Typst file
        run: typst compile document.typ document.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: document.pdf

name: Compile Typst to PDF
# thanks @ Mammouth.AI / Gemini 3.5 Flash for support

on:
  push:
    paths:
      - '**.typ'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Compile Typst files
        run: |
          find . -name "*.typ" -not -path "*template*" -not -path "*design*" -print0 | while IFS= read -r -d '' file; do
            pdf_file="${file%.typ}.pdf"
            echo "Compiling: $file -> $pdf_file"
            typst compile "$file" "$pdf_file"
          done

      - name: Upload PDFs (Keeps folder structure in ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: compiled-pdfs
          path: "**/*.pdf"
